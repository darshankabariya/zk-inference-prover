[package]
name = "b65-pipeline"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
stwo = { version = "2.3.0", features = ["prover", "parallel"] }
stwo-constraint-framework = { version = "2.3.0", features = ["prover", "parallel"] }
itertools = "0.12"
num-traits = "0.2"
rand = { version = "0.9", features = ["small_rng"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "b65"
path = "src/main.rs"
